<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Facundo Tamburro — Full-Stack Developer</title>
  <desc id="desc">Profile banner for Facundo Tamburro, focused on systems, data, products, and automation.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#0891B2" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.075"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#070B14"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
    <circle cx="1080" cy="-35" r="190" fill="#7C3AED" fill-opacity="0.09"/>
    <circle cx="1080" cy="-35" r="120" fill="#22D3EE" fill-opacity="0.05"/>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="29.25" fill="none" stroke="#243044" stroke-width="1.5"/>
  <rect x="56" y="48" width="70" height="4" rx="2" fill="url(#accent)"/>
  <text x="144" y="55" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.4">PROFILE / 2026</text>

  <text x="56" y="150" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="750" letter-spacing="-2.5">FACUNDO</text>
  <text x="56" y="220" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="750" letter-spacing="-2.5">TAMBURRO</text>

  <text x="59" y="266" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" letter-spacing="2.3">FULL-STACK DEVELOPER · SOFTWARE BUILDER</text>
  <text x="59" y="310" fill="#7F8EA3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Production systems, APIs, data workflows &amp; digital products.</text>

  <circle cx="65" cy="365" r="12" fill="#22C55E" fill-opacity="0.13" filter="url(#softGlow)"/>
  <circle cx="65" cy="365" r="4" fill="#4ADE80"/>
  <text x="80" y="370" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">BUENOS AIRES / OPEN TO REMOTE OPPORTUNITIES</text>

  <g transform="translate(815 62)">
    <rect width="323" height="296" rx="22" fill="#0C1220" fill-opacity="0.86" stroke="#2B354A"/>
    <circle cx="24" cy="24" r="4" fill="#FB7185"/>
    <circle cx="40" cy="24" r="4" fill="#FBBF24"/>
    <circle cx="56" cy="24" r="4" fill="#4ADE80"/>
    <text x="265" y="29" fill="#536176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">FOCUS</text>

    <path d="M58 80V230" stroke="#334155" stroke-width="2" stroke-dasharray="3 8"/>
    <path d="M58 80C112 80 104 112 144 112H244" fill="none" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M58 130C108 130 112 154 150 154H260" fill="none" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M58 180C108 180 102 196 142 196H236" fill="none" stroke="#3B82F6" stroke-opacity="0.48" stroke-width="1.5"/>
    <path d="M58 230C106 230 112 238 150 238H250" fill="none" stroke="#22D3EE" stroke-opacity="0.48" stroke-width="1.5"/>

    <circle cx="58" cy="80" r="7" fill="#0C1220" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="58" cy="130" r="7" fill="#0C1220" stroke="#818CF8" stroke-width="2"/>
    <circle cx="58" cy="180" r="7" fill="#0C1220" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="58" cy="230" r="7" fill="#0C1220" stroke="#22D3EE" stroke-width="2"/>

    <text x="84" y="85" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">01 / SYSTEMS</text>
    <text x="84" y="135" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">02 / DATA</text>
    <text x="84" y="185" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">03 / PRODUCTS</text>
    <text x="84" y="235" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">04 / AUTOMATION</text>

    <rect x="26" y="265" width="271" height="1" fill="#273244"/>
    <text x="26" y="284" fill="#536176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.1">ENGINEERING × PRODUCT × CREATIVITY</text>
  </g>
</svg>
